name: CI

on:
  pull_request:
    branches: [main]
  # i push su main sono le pubblicazioni (Vercel deploya da main)
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # stessa versione di Vercel (Node.js 24.x)
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Non bloccante: ci sono errori di lint preesistenti non corretti in
      # questa fase (vedi docs/agria/05-infrastruttura.md). Il job continua
      # comunque, cosi la build resta il gate reale della pull request.
      - run: npm run lint
        continue-on-error: true

      - run: npm run build
